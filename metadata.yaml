versions:
  - sha: d759ca042296727f2d0dcd7ddfcf4040bf6ae92a
    changeNotes: >-
      Initial release of the Facebook Conversions API tag template for server
      containers. Maps GA4 and Data Client event data onto Meta's server event,
      user_data, custom_data and app_data objects, normalises and hashes personal
      data with SHA-256, resolves and restores _fbp and _fbc, and supports multiple
      datasets, event_id deduplication, event enhancement, consent gating and
      enrichment from TrackingHippo.io container module headers.
